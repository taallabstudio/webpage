<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f6f8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="description" content="OCEAN is your private TaalLab workspace for notes, pages and ideas." />
    <title>OCEAN — Your workspace</title>
    <link rel="icon" type="image/svg+xml" href="/ocean-icon.svg" />
    <link rel="apple-touch-icon" type="image/svg+xml" href="/ocean-icon.svg" />
    <link rel="manifest" href="/ocean.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" />
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;background:#f4f6f8;color:#66717d;display:grid;place-items:center;font:14px system-ui">Opening OCEAN…</div></div>
    <script type="module" src="/src/main.jsx"></script>
  <aside id="taal-cookie-notice" role="region" aria-label="Cookie and storage notice" hidden>
  <div class="taal-cookie-copy"><strong>Essential storage only</strong><p>Taal Lab uses essential session cookies and browser storage for sign-in and your shopping cart. Optional advertising and analytics trackers are not currently enabled. <a href="/privacy.html">Read the Privacy Policy</a>.</p></div>
  <button type="button" id="taal-cookie-dismiss">Got it</button>
</aside>
<style>
#taal-cookie-notice{position:fixed;z-index:9999;left:20px;right:20px;bottom:20px;max-width:760px;margin:auto;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:18px;background:#171a20;color:#f5f7fa;border:1px solid #454b55;border-radius:16px;box-shadow:0 14px 50px rgba(0,0,0,.28);font:14px/1.5 Inter,system-ui,sans-serif}
#taal-cookie-notice[hidden]{display:none}
#taal-cookie-notice p{margin:4px 0 0;color:#d1d6dd;font-size:12px}
#taal-cookie-notice a{color:#9ecbff;text-decoration:underline;text-underline-offset:3px}
#taal-cookie-notice button{flex:none;border:0;border-radius:999px;padding:10px 16px;background:#f3f5f7;color:#171a20;font-weight:700;cursor:pointer}
#taal-cookie-notice button:focus-visible{outline:3px solid #7dbaff;outline-offset:3px}
@media(max-width:560px){#taal-cookie-notice{left:12px;right:12px;bottom:12px;align-items:flex-start;flex-direction:column}#taal-cookie-notice button{width:100%}}
</style>
<script>
(()=>{const box=document.getElementById("taal-cookie-notice"),button=document.getElementById("taal-cookie-dismiss");if(!box||!button)return;try{if(localStorage.getItem("taallab.cookie.notice.v1")==="dismissed")return;}catch{}box.hidden=false;button.addEventListener("click",()=>{box.hidden=true;try{localStorage.setItem("taallab.cookie.notice.v1","dismissed");}catch{}});})();
</script>
</body>
</html>
