name: Pull request build validation

on:
  push:
    branches:
      - "compliance/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Generate dependency licence inventory
        run: node scripts/audit-dependencies.mjs /tmp/taallab-dependency-licenses.md
      - name: Build frontend
        run: npm run build
      - name: Bundle Cloudflare Worker without deploying
        run: npx esbuild worker/index.ts --bundle --platform=browser --format=esm --outfile=/tmp/taallab-worker.js
      - name: Install browser accessibility test tools
        run: |
          npm install --no-save playwright @axe-core/playwright
          npx playwright install --with-deps chromium
      - name: Audit public pages against WCAG
        run: node scripts/accessibility-audit.mjs
      - name: Upload compliance audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taallab-compliance-audit-reports
          path: |
            /tmp/taallab-dependency-licenses.md
            /tmp/taallab-accessibility-report.json
          if-no-files-found: warn
