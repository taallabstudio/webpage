name: Build OCEAN for Android

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ocean-android-build
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
          "$SDKMANAGER" "ndk;27.2.12479018"

      - name: Configure Android NDK
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Initialize Android project
        working-directory: src-tauri
        run: cargo tauri android init --ci

      - name: Generate OCEAN three-wave app icons
        working-directory: src-tauri
        run: cargo tauri icon icons/three-waves.svg

      - name: Build Android APK
        working-directory: src-tauri
        run: cargo tauri android build --apk --debug --ci --target aarch64

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: OCEAN-Android-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30
