name: OCEAN isolated build check

on:
  push:
    branches:
      - fix/ocean-property-menu-portal

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build frontend (no deployment)
        run: npm run build
