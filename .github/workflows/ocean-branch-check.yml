name: OCEAN isolated preview

on:
  push:
    branches:
      - ocean-google-calendar

permissions:
  contents: read

concurrency:
  group: ocean-google-calendar-preview
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout OCEAN development branch
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build OCEAN frontend assets
        run: npm run build
      - name: Deploy isolated Cloudflare Worker Preview
        run: npx wrangler preview --name ocean-google-calendar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
