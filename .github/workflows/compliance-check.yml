name: Compliance branch validation

on:
  push:
    branches:
      - compliance-hardening
    paths:
      - "src/**"
      - "worker/**"
      - "public/**"
      - "index.html"
      - "ocean.html"
      - "admin/**"
      - "package.json"
      - "wrangler.toml"
      - "scripts/**"
      - ".github/workflows/compliance-check.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate web assets and Worker bundle (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build web assets
        run: npm run build
      - name: Validate Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
      - name: Generate npm dependency license inventory
        run: npx --yes license-checker --production --json > npm-license-inventory.json
      - name: Generate Rust dependency license inventory
        run: |
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 > cargo-metadata.json
          jq '[.packages[] | {name,version,license,license_file}]' cargo-metadata.json > rust-license-inventory.json
      - name: Commit generated dependency lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Lock dependency versions for compliance audit"
            git push
          fi
      - name: Upload dependency license inventories
        uses: actions/upload-artifact@v4
        with:
          name: third-party-license-inventories
          path: |
            npm-license-inventory.json
            rust-license-inventory.json
          retention-days: 14
