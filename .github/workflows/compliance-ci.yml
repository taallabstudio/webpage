name: Main branch validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: compliance-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ""
      - name: Install dependencies
        run: npm ci
      - name: Audit npm dependency vulnerabilities
        run: |
          mkdir -p .audit
          npm audit --json > .audit/npm-audit-all.json || true
          npm audit --omit=dev --json > .audit/npm-audit-production.json || true
      - name: Generate dependency licence inventory
        run: mkdir -p .audit && npx --yes license-checker --json --out .audit/third-party-licenses.json && node scripts/generate-license-inventory.mjs && node scripts/generate-third-party-notices.mjs
      - name: Preserve lockfile and licence inventory
        uses: actions/upload-artifact@v4
        with:
          name: taallab-dependency-audit
          path: |
            package-lock.json
            .audit/third-party-licenses.json
            .audit/npm-audit-all.json
            .audit/npm-audit-production.json
            .audit/THIRD-PARTY-NOTICES.md
            .audit/third-party-notices-summary.json
            docs/THIRD-PARTY-LICENSE-INVENTORY.md
          if-no-files-found: error
          retention-days: 14
      - name: Build website and app assets
        run: npm run build
      - name: Bundle Cloudflare Worker without deploying
        run: npx esbuild worker/index.ts --bundle --platform=browser --format=esm --outfile=/tmp/taallab-worker.js
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir=worker-dist
      - name: Commit reproducible lockfile and licence inventory
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json docs/THIRD-PARTY-LICENSE-INVENTORY.md
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible npm lockfile and licence inventory"
            git push
          fi
