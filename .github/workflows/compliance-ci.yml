name: Main branch validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: compliance-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ""
      - name: Install dependencies
        run: npm install
      - name: Generate dependency licence inventory
        run: npx --yes license-checker --json --out /tmp/taallab-third-party-licenses.json
      - name: Preserve lockfile and licence inventory
        uses: actions/upload-artifact@v4
        with:
          name: taallab-dependency-audit
          path: |
            package-lock.json
            /tmp/taallab-third-party-licenses.json
          if-no-files-found: error
          retention-days: 14
      - name: Build website and app assets
        run: npm run build
      - name: Bundle Cloudflare Worker without deploying
        run: npx esbuild worker/index.ts --bundle --platform=browser --format=esm --outfile=/tmp/taallab-worker.js
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir=worker-dist
