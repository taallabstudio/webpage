name: Compliance branch build

on:
  push:
    branches:
      - compliance/p0-p1-p2-hardening
      - compliance/p1-consent-accessibility-licenses
  pull_request:
    branches:
      - main
      - compliance/p0-p1-p2-hardening

permissions:
  contents: read

concurrency:
  group: compliance-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: ""
      - name: Install dependencies
        run: npm install
      - name: Build website and app assets
        run: npm run build
      - name: Generate production dependency licence report
        run: npx --yes license-checker --production --json --out=third-party-license-report.json
      - name: Upload dependency licence report
        uses: actions/upload-artifact@v4
        with:
          name: third-party-license-report
          path: third-party-license-report.json
          retention-days: 90
      - name: Bundle Cloudflare Worker without deploying
        run: npx esbuild worker/index.ts --bundle --platform=browser --format=esm --outfile=/tmp/taallab-worker.js
      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir=worker-dist
