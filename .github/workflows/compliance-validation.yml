name: Compliance branch validation

on:
  push:
    branches:
      - "compliance/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compliance-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build website and application
        run: npm run build

      - name: Audit installed dependencies
        run: |
          npm audit --json > /tmp/taallab-npm-audit.json || true
          node -e 'const r=require("/tmp/taallab-npm-audit.json"); const v=r.vulnerabilities||{}; console.log("NPM_AUDIT_SUMMARY",JSON.stringify(r.metadata?.vulnerabilities||{})); console.log("NPM_AUDIT_DETAILS",JSON.stringify(Object.entries(v).map(([name,p])=>({name,severity:p.severity,isDirect:p.isDirect,range:p.range,fixAvailable:p.fixAvailable,via:(p.via||[]).map(x=>typeof x==="string"?x:{title:x.title,url:x.url,range:x.range})})),null,2));'

      - name: Upload dependency audit report
        uses: actions/upload-artifact@v4
        with:
          name: taallab-npm-audit
          path: /tmp/taallab-npm-audit.json
          if-no-files-found: error

      - name: Generate third-party dependency licence report
        run: |
          npx --yes license-checker --json > /tmp/taallab-third-party-licenses.json
          node -e 'const r=require("/tmp/taallab-third-party-licenses.json"); const licenses={}; const missing=[]; for (const [name,p] of Object.entries(r)) { const l=String(p.licenses||"UNKNOWN"); licenses[l]=(licenses[l]||0)+1; if (!p.licenses || /unknown|unlicensed|noassertion/i.test(l)) missing.push(name); } console.log("THIRD_PARTY_LICENSE_COUNTS",JSON.stringify(licenses)); console.log("PACKAGES_REQUIRING_REVIEW",JSON.stringify(missing));'

      - name: Upload dependency licence report
        uses: actions/upload-artifact@v4
        with:
          name: taallab-third-party-licenses
          path: /tmp/taallab-third-party-licenses.json
          if-no-files-found: error

      - name: Validate Cloudflare Worker bundle without deploying
        run: npx wrangler deploy --dry-run --outdir /tmp/taallab-worker-dry-run
