<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex,nofollow">
<title>Unsubscribe | TAAL LAB</title>
<style>
:root{color-scheme:light;--ink:#1d2229;--muted:#626b76;--line:#e1e6eb;--blue:#075fb8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7f8;color:var(--ink);font:15px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}
main{width:min(520px,100%);padding:32px;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 18px 55px rgba(35,49,63,.09)}
.brand{font-weight:800;letter-spacing:.08em;font-size:13px}h1{font-size:30px;line-height:1.15;letter-spacing:-.04em;margin:30px 0 10px}p{color:var(--muted)}button{border:0;border-radius:10px;background:#0068cc;color:#fff;font:700 14px system-ui;padding:13px 18px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}.status{margin-top:16px;font-size:13px}.status.error{color:#b42318}.status.success{color:#167044}a{color:var(--blue)}:focus-visible{outline:3px solid #075fb8;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="brand">TAAL LAB</div>
  <h1>Unsubscribe from marketing emails</h1>
  <p>Confirm below to stop receiving TaalLab product news and marketing emails. Essential account, security and purchase messages will continue.</p>
  <button id="unsubscribe" type="button">Confirm unsubscribe</button>
  <p id="status" class="status" role="status" aria-live="polite"></p>
  <p><a href="/account/settings">Manage email preferences in Account Settings</a></p>
</main>
<script>
(()=> {
  const button=document.getElementById("unsubscribe");
  const status=document.getElementById("status");
  const token=new URLSearchParams(location.search).get("token")||"";
  if(!token){button.disabled=true;status.className="status error";status.textContent="This unsubscribe link is incomplete. Sign in and update your email preferences in Account Settings.";return;}
  button.addEventListener("click",async()=>{
    button.disabled=true;status.className="status";status.textContent="Updating your preference…";
    try{
      const response=await fetch("/api/marketing/unsubscribe",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token})});
      const result=await response.json().catch(()=>({}));
      if(!response.ok)throw new Error(result.error||"Could not unsubscribe.");
      status.className="status success";status.textContent=result.message||"You have been unsubscribed.";
      button.hidden=true;
      history.replaceState(null,"","/unsubscribe.html");
    }catch(error){status.className="status error";status.textContent=error.message||"Could not unsubscribe.";button.disabled=false;}
  });
})();
</script>
<script src="/privacy-notice.js" defer></script>
</body>
</html>
