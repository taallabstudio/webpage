<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure checkout — TAAL LAB</title>
<style>
:root{color-scheme:dark;--bg:#090d14;--panel:#111a28;--line:#263448;--text:#edf4ff;--muted:#9aabc2;--blue:#63b8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#15314a 0,transparent 50%),var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 22px 70px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:800;letter-spacing:.16em}.brand span{color:var(--blue)}a{color:inherit;text-decoration:none}.panel{margin-top:70px;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:clamp(22px,5vw,42px)}.eyebrow{color:var(--blue);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}.panel h1{font-size:2.3rem;line-height:1.1;margin:10px 0}.muted{color:var(--muted)}label{display:block;margin:24px 0 7px}input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:#080e17;color:var(--text);font:inherit}.btn{display:block;width:100%;margin-top:20px;padding:14px;border:0;border-radius:11px;background:var(--blue);color:#07111d;font:inherit;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.error{color:#ffb3b3}.success{color:#9ff0c3}.rule{height:1px;background:var(--line);margin:24px 0}.small{font-size:.85rem;color:var(--muted)}
</style></head><body><main class="wrap"><nav class="nav"><a class="brand" href="/">TAAL<span> LAB</span></a><a href="/shop.html">← Shop</a></nav>
<section class="panel"><div class="eyebrow">Secure checkout</div><h1 id="title">Preparing your order…</h1><p id="description" class="muted">Your payment is processed securely by Razorpay.</p><div class="rule"></div><div id="price"></div><label for="email">Email for your order (optional)</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com"><button class="btn" id="pay" disabled>Loading checkout…</button><p id="message" role="status" class="small"></p><p class="small">Your download link is time-limited and only works after a verified payment. Do not share it.</p></section></main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const params=new URLSearchParams(location.search),id=params.get("product"),title=document.querySelector("#title"),desc=document.querySelector("#description"),price=document.querySelector("#price"),pay=document.querySelector("#pay"),message=document.querySelector("#message");let product=null;
const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(n);
function say(text,kind=""){message.textContent=text;message.className=kind}
async function post(url,data){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed");return d}
fetch("/api/store/products").then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not load product");product=(d.products||[]).find(p=>p.id===id);if(!product)throw new Error("Product not found.");title.textContent=product.name;desc.textContent=product.description;price.textContent=product.active?money(product.price):"This product is not available yet.";if(product.active){pay.disabled=false;pay.textContent="Pay securely"}else{pay.textContent="Not available yet";say("This product is not available to purchase yet.")}}).catch(e=>{title.textContent="Checkout unavailable";say(e.message,"error")});
pay.addEventListener("click",async()=>{if(!product?.active)return;pay.disabled=true;pay.textContent="Starting secure checkout…";say("");try{const order=await post("/api/store/create-order",{productId:product.id,email:document.querySelector("#email").value.trim()});if(!window.Razorpay)throw new Error("Secure checkout could not load. Please disable script blockers and retry.");const rz=new Razorpay({key:order.keyId,amount:order.amount,currency:order.currency,name:"TAAL LAB",description:product.name,order_id:order.orderId,prefill:{email:document.querySelector("#email").value.trim()},theme:{color:"#63b8ff"},handler:async response=>{try{say("Verifying your payment…");const result=await post("/api/store/verify-payment",response);location.href=result.downloadUrl}catch(e){say(e.message,"error");pay.disabled=false;pay.textContent="Retry verification"}} ,modal:{ondismiss:()=>{pay.disabled=false;pay.textContent="Pay securely"}}});rz.on("payment.failed",r=>say(r.error?.description||"Payment did not complete.","error"));rz.open()}catch(e){say(e.message,"error");pay.disabled=false;pay.textContent="Pay securely"}});
</script></body></html>
