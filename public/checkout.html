<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure checkout — TAAL LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f5f7f8;--panel:rgba(255,255,255,.9);--line:#e1e6eb;--text:#1d2229;--muted:#707985;--blue:#0878e8;--blue-soft:#eaf4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 Inter,system-ui,sans-serif;min-height:100vh}.glow{position:fixed;inset:0;pointer-events:none;background:radial-gradient(circle at 75% 10%,rgba(93,174,235,.18),transparent 32%),radial-gradient(circle at 15% 75%,rgba(207,218,228,.35),transparent 35%);z-index:-1}.wrap{width:min(1120px,100%);margin:auto;padding:0 5vw 50px}.nav{height:82px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(29,34,41,.1)}a{color:inherit;text-decoration:none}.brand{font-family:"Space Grotesk";font-size:18px;font-weight:700;letter-spacing:-.04em}.brand span{color:var(--blue)}.nav>a:last-child{font-size:12px;font-weight:700;color:#4f5863}.panel{width:min(620px,100%);margin:75px auto 0;border:1px solid rgba(218,225,232,.95);background:var(--panel);border-radius:26px;padding:clamp(24px,5vw,48px);box-shadow:0 24px 70px rgba(35,49,63,.08);backdrop-filter:blur(18px)}.eyebrow{display:inline-flex;align-items:center;gap:9px;color:var(--blue);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}.eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 4px rgba(8,120,232,.1)}.panel h1{font-family:"Space Grotesk";font-size:clamp(32px,6vw,48px);line-height:1.04;letter-spacing:-.06em;margin:18px 0 10px}.muted{color:var(--muted)}label{display:block;margin:25px 0 7px;font-size:12px;font-weight:700}input{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--text);font:inherit;outline:none}input:focus{border-color:#8abff1;box-shadow:0 0 0 3px rgba(8,120,232,.09)}.btn{display:block;width:100%;margin-top:20px;padding:14px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer;transition:filter .2s}.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.45;cursor:not-allowed}.error{color:#b7443a}.success{color:#23834c}.rule{height:1px;background:var(--line);margin:24px 0}.small{font-size:11px;color:var(--muted);line-height:1.7}.panel>.small{margin-top:18px}
</style></head><body><div class="glow" aria-hidden="true"></div><main class="wrap"><nav class="nav"><a class="brand" href="/">TAAL <span>LAB</span></a><a href="/shop.html">← Back to shop</a></nav>
<section class="panel"><div class="eyebrow">Secure checkout</div><h1 id="title">Preparing your order…</h1><p id="description" class="muted">Your payment is processed securely by Razorpay.</p><div class="rule"></div><div id="price"></div><label for="email">Email for your order (optional)</label><input id="email" type="email" autocomplete="email" maxlength="254" placeholder="you@example.com"><button class="btn" id="pay" disabled>Loading checkout…</button><p id="message" role="status" class="small"></p><p class="small">Your download link is time-limited and only works after a verified payment. Do not share it.</p></section></main>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const params=new URLSearchParams(location.search),id=params.get("product"),title=document.querySelector("#title"),desc=document.querySelector("#description"),price=document.querySelector("#price"),pay=document.querySelector("#pay"),message=document.querySelector("#message");let product=null;
const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR"}).format(n);
function say(text,kind=""){message.textContent=text;message.className="small "+kind}
async function post(url,data){const r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Request failed");return d}
fetch("/api/store/products").then(async r=>{const d=await r.json();if(!r.ok)throw new Error(d.error||"Could not load product");product=(d.products||[]).find(p=>p.id===id);if(!product)throw new Error("Product not found.");title.textContent=product.name;desc.textContent=product.description;price.textContent=product.active?money(product.price):"This product is not available yet.";if(product.active){pay.disabled=false;pay.textContent="Pay securely"}else{pay.textContent="Not available yet";say("This product is not available to purchase yet.")}}).catch(e=>{title.textContent="Checkout unavailable";say(e.message,"error")});
pay.addEventListener("click",async()=>{if(!product?.active)return;pay.disabled=true;pay.textContent="Starting secure checkout…";say("");try{const order=await post("/api/store/create-order",{productId:product.id,email:document.querySelector("#email").value.trim()});if(!window.Razorpay)throw new Error("Secure checkout could not load. Please disable script blockers and retry.");const rz=new Razorpay({key:order.keyId,amount:order.amount,currency:order.currency,name:"TAAL LAB",description:product.name,order_id:order.orderId,prefill:{email:document.querySelector("#email").value.trim()},theme:{color:"#0878e8"},handler:async response=>{try{say("Verifying your payment…");const result=await post("/api/store/verify-payment",response);location.href=result.downloadUrl}catch(e){say(e.message,"error");pay.disabled=false;pay.textContent="Retry verification"}},modal:{ondismiss:()=>{pay.disabled=false;pay.textContent="Pay securely"}}});rz.on("payment.failed",r=>say(r.error?.description||"Payment did not complete.","error"));rz.open()}catch(e){say(e.message,"error");pay.disabled=false;pay.textContent="Pay securely"}});
</script></body></html>
