<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your download — TAAL LAB</title><style>
:root{color-scheme:dark;--bg:#090d14;--panel:#111a28;--line:#263448;--text:#edf4ff;--muted:#9aabc2;--blue:#63b8ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#15314a 0,transparent 50%),var(--bg);color:var(--text);font:16px/1.6 Inter,system-ui,sans-serif}.wrap{max-width:680px;margin:auto;padding:28px 22px}.nav{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:20px}.brand{font-weight:800;letter-spacing:.16em}.brand span{color:var(--blue)}a{color:inherit;text-decoration:none}.panel{margin-top:80px;border:1px solid var(--line);background:var(--panel);border-radius:22px;padding:clamp(22px,5vw,42px)}.eyebrow{color:var(--blue);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}.panel h1{font-size:2.4rem;line-height:1.1;margin:10px 0}.muted{color:var(--muted)}.btn{display:inline-block;margin-top:18px;padding:13px 18px;border-radius:11px;background:var(--blue);color:#07111d;font-weight:800}.error{color:#ffb3b3}.small{color:var(--muted);font-size:.85rem}
</style></head><body><main class="wrap"><nav class="nav"><a class="brand" href="/">TAAL<span> LAB</span></a><a href="/shop.html">Shop</a></nav><section class="panel"><div class="eyebrow">Order complete</div><h1>Your download is ready.</h1><p class="muted">Your payment was verified. Use the button below to download your product from private storage.</p><a class="btn" id="download" href="#">Download product ↓</a><p id="message" class="small" role="status"></p><p class="small">This secure link expires after 30 minutes. Keep your original receipt if you need help.</p></section></main><script>
const token=new URLSearchParams(location.search).get("token"),button=document.querySelector("#download"),message=document.querySelector("#message");if(!token){button.hidden=true;message.textContent="No secure download token was found. Please use the link from your successful checkout or contact contact@taallab.work."}else{button.href="/api/store/download?token="+encodeURIComponent(token);button.addEventListener("click",()=>{message.textContent="Your download should begin shortly. If it does not, try the button again."})}
</script></body></html>
