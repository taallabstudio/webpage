name = "webpage"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[vars]
APP_ORIGIN = "https://taallab.work"
DEFAULT_EXPIRY_DAYS = "7"

[[d1_databases]]
binding = "DB"
database_name = "taallab-transfers"
database_id = "73795e54-d7bc-4406-99b0-515c50396bb1"
migrations_dir = "migrations"

[triggers]
crons = ["0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/f/*"]
