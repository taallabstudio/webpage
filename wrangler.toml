name = "webpage"
main = "worker/index.ts"
compatibility_date = "2026-10-01"

[vars]
APP_ORIGIN = "https://taallab.work"
DEFAULT_EXPIRY_DAYS = "7"
GOOGLE_CLIENT_ID = "904278224751-qihnpb2neuqouolbkjese0fg6ntemf83.apps.googleusercontent.com"
GOOGLE_LOGIN_CLIENT_ID = "904278224751-h85rtgjbr9n29u5p09u59s593kls616p.apps.googleusercontent.com"

[[d1_databases]]
binding = "DB"
database_name = "taallab-transfers"
database_id = "73795e54-d7bc-4406-99b0-515c50396bb1"
migrations_dir = "migrations"

[previews.vars]
APP_ORIGIN = "https://taallab.work"
DEFAULT_EXPIRY_DAYS = "7"

[[previews.d1_databases]]
binding = "DB"
database_name = "taallab-transfers-preview"
